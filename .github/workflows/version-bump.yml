name: Version Bump and Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # Pin to .nvmrc so releases build with the same Node as CI and
          # local dev. This workflow previously hardcoded 24, which meant a
          # release could pass or fail on a Node nobody else uses.
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Get changed files
        id: changes
        run: |
          git fetch --tags
          # Baseline is the newest tag reachable from HEAD, not from HEAD~1.
          # HEAD~1 only follows a merge commit's first parent, so after the
          # release PR merges it found the tag *before* the release commit and
          # re-counted already-shipped commits -- which released twice per
          # merge. HEAD reaches the new tag through the second parent.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --format=%s HEAD~1..HEAD)
          else
            COMMITS=$(git log --format=%s $PREV_TAG..HEAD)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Check if any commit matches conventional commit pattern (with or without scope)
          if echo "$COMMITS" | grep -qE '^(feat|fix| BREAK CHANGE)(\(.+\))?:'; then
            echo "needs_release=true" >> $GITHUB_OUTPUT
          else
            echo "needs_release=false" >> $GITHUB_OUTPUT
          fi

      # Was: rm -rf node_modules package-lock.json && npm install
      # That regenerated the lockfile from main's package.json on every
      # release, which silently dropped any dependency main did not know
      # about and was the root cause of the package-lock.json conflicts
      # between main and development. `npm ci` installs exactly the
      # committed lockfile and fails loudly if it disagrees with
      # package.json, instead of quietly rewriting it.
      - name: Install dependencies
        run: npm ci

      - name: Bump version and tag
        if: steps.changes.outputs.needs_release == 'true'
        run: npx standard-version

      # main is protected by branch protection, and GitHub Apps are not exempt
      # from it -- personal repositories cannot add a bypass actor either. A
      # `git push --dry-run` probe confirmed the bot is rejected, so pushing
      # straight to main would have failed on every release.
      #
      # The version bump therefore goes to a per-release branch and lands on
      # main through an ordinary PR, which runs the same CI as anything else.
      - name: Get release version
        if: steps.changes.outputs.needs_release == 'true'
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Push release branch and tag
        if: steps.changes.outputs.needs_release == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git push origin "HEAD:refs/heads/release/$TAG"
          git push origin "refs/tags/$TAG"

      - name: Build and Deploy to Firebase
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_REACT_APP_TITLE: ${{ secrets.VITE_REACT_APP_TITLE }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy to Firebase
        if: steps.changes.outputs.needs_release == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYFINANCETRACKER_B257E }}
          channelId: live
          projectId: myfinancetracker-b257e
          # Pin the finance app. The project now hosts two sites (#193), and
          # omitting `target` makes the action deploy *all* of them -- but the
          # build step above only produces apps/web/dist, so an unpinned deploy
          # would fail on the missing website directory and take the release
          # down with it. Deploying the marketing site is a separate release
          # decision, not something a version bump should do by accident.
          target: app

      - name: Open release PR
        if: steps.changes.outputs.needs_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh pr create \
            --base main \
            --head "release/$TAG" \
            --title "chore(release): $TAG" \
            --body "Automated version bump and changelog for \`$TAG\`." \
            || gh pr view "release/$TAG" --json url -q .url

      - name: Enable auto-merge on release PR
        if: steps.changes.outputs.needs_release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh pr merge "release/$TAG" --merge --auto \
            || echo "Auto-merge unavailable; merge the release PR manually."

      - name: Create GitHub Release
        if: steps.changes.outputs.needs_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # actions/create-release@v1 targets Node 12 and is unmaintained.
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            || echo "Release $TAG already exists"

      # Keeps `development` a descendant of `main` after every release, so the
      # next development -> main merge is always a fast-forward instead of a
      # package-lock.json conflict. Runs even if the deploy fails, because the
      # version bump on main is what causes the drift, not the deploy.
      - name: Sync main back into development
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_sync_pr() {
            gh pr create \
              --base development \
              --head main \
              --title "chore: sync main into development after release" \
              --body "Automated sync-back. \`development\` moved after this release was cut, so \`main\` cannot be fast-forwarded into it. Resolve any conflicts and merge." \
              || echo "A sync PR is already open"
          }

          git fetch origin main development
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse origin/development)" ]; then
            echo "main and development are already in sync"
          elif git merge-base --is-ancestor origin/development origin/main; then
            # A push can still be rejected if development is updated between
            # the fetch above and the push, so fall back to a PR on failure.
            if git push origin origin/main:development; then
              echo "Fast-forwarded development to main ($(git rev-parse --short origin/main))"
            else
              echo "development moved concurrently; opening a sync PR instead"
              open_sync_pr
            fi
          else
            echo "development has diverged from main; opening a sync PR instead"
            open_sync_pr
          fi