name: CI

# Runs on every PR regardless of target, plus pushes to the long-lived
# branches. The Firebase preview workflow only covers PRs against main and
# only runs a build, so nothing verified tests or lint before this existed.
on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc -b runs here, so a type error fails the job before we spend
      # time on tests.
      - name: Typecheck and build
        run: npm run build

      # Non-blocking on purpose: the repo carries 7 pre-existing errors
      # (React hook correctness in BudgetTargetDialog, TransactionForm,
      # EtfTransactionModal, TransactionModal, plus prefer-const and
      # no-useless-assignment). Flipping this to blocking before those are
      # fixed would block every PR. Track and remove this `continue-on-error`
      # once the baseline is clean.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      # main does not have a `test` script yet -- it arrives with the next
      # development -> main merge. Without this guard, any PR to main that did
      # not also land the test setup would fail on "Missing script: test",
      # which is a false failure rather than a real one.
      - name: Test
        run: |
          if node -p "require('./package.json').scripts?.test || ''" | grep -q .; then
            npm test
          else
            echo "No test script on this branch; skipping tests."
          fi

  verify-website:
    name: Marketing site typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` at the root only builds apps/web on purpose (#193): the
      # release workflow deploys that artifact to the live finance site, and
      # widening it to every workspace would put a marketing build in the
      # deploy path. The website therefore needs its own explicit job, or
      # nothing would ever typecheck it.
      - name: Typecheck and build marketing site
        run: npm run build --workspace apps/website

      - name: Test marketing site
        run: npm run test --workspace apps/website

  # Lint is covered by the root `npm run lint` above, which already runs eslint
  # across every workspace; apps/website contributes no findings.
